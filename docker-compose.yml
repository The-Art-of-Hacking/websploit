# Opt-in AI track. Ignored by `docker compose up` unless `--profile ai` is set.
# mind-core is shared infrastructure, not a vulnerable lab.
# oracle-booth is the prompt-injection lab and is intentionally vulnerable.
# marionette is the excessive-agency lab and is intentionally vulnerable.
# It joins websploit and websploit-isolated. No other service joins the isolated network.
# tainted-well is the supply-chain, poisoning, and vector lab and is intentionally vulnerable.
# It stays on websploit only.
# echo-chamber is the LLM05 lab and is intentionally vulnerable.
# Reserved and not created here: 10.6.6.55-.56 and host ports 5035-5036.
# Unused buffer: 10.6.6.46-.49. Unused remainder: 10.6.6.57-.59 and ports 5037-5039.
  mind-core:
    profiles: ["ai"]
    container_name: mind-core
    build: ./agentic-ai-labs/mind-core
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      MIND_CORE_BACKEND: deterministic
      HOME: /tmp
    networks:
      websploit:
        ipv4_address: 10.6.6.50
    ports:
      - "5030:5030"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5030/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  oracle-booth:
    profiles: ["ai"]
    container_name: oracle-booth
    build: ./agentic-ai-labs/oracle-booth
    restart: unless-stopped
    depends_on:
      mind-core:
        condition: service_healthy
    user: "10003:10003"
    read_only: true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      HOME: /tmp
      MIND_CORE_URL: http://mind-core:5030
      ORACLE_BOOTH_MIND_CORE_TIMEOUT_SECONDS: "2"
    networks:
      websploit:
        ipv4_address: 10.6.6.51
    ports:
      - "5031:5031"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5031/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  marionette:
    profiles: ["ai"]
    container_name: marionette
    build: ./agentic-ai-labs/marionette
    restart: unless-stopped
    depends_on:
      mind-core:
        condition: service_healthy
    user: "10004:10004"
    read_only: true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      HOME: /tmp
      MIND_CORE_URL: http://mind-core:5030
      MARIONETTE_MIND_CORE_TIMEOUT_SECONDS: "2"
      MARIONETTE_FETCH_TIMEOUT_SECONDS: "2"
    networks:
      websploit:
        ipv4_address: 10.6.6.52
      websploit-isolated:
        ipv4_address: 10.7.7.52
    ports:
      - "5032:5032"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5032/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  tainted-well:
    profiles: ["ai"]
    container_name: tainted-well
    build: ./agentic-ai-labs/tainted-well
    restart: unless-stopped
    depends_on:
      mind-core:
        condition: service_healthy
    user: "10005:10005"
    read_only: true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      HOME: /tmp
      MIND_CORE_URL: http://mind-core:5030
      TAINTED_WELL_MIND_CORE_TIMEOUT_SECONDS: "2"
    networks:
      websploit:
        ipv4_address: 10.6.6.53
    ports:
      - "5033:5033"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5033/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  echo-chamber:
    profiles: ["ai"]
    container_name: echo-chamber
    build: ./agentic-ai-labs/echo-chamber
    restart: unless-stopped
    depends_on:
      mind-core:
        condition: service_healthy
    user: "10002:10002"
    read_only: true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      HOME: /tmp
      MIND_CORE_URL: http://mind-core:5030
      ECHO_CHAMBER_MIND_CORE_TIMEOUT_SECONDS: "2"
      ECHO_CHAMBER_SHELL_TIMEOUT_SECONDS: "2"
    networks:
      websploit:
        ipv4_address: 10.6.6.54
    ports:
      - "5034:5034"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5034/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# Network configuration
networks:
  websploit:
    driver: bridge
    ipam:
      config:
        - subnet: 10.6.6.0/24
          gateway: 10.6.6.1
  # marionette is the only service attached. internal: true means a container
  # on this network alone has no route to the public internet.
  websploit-isolated:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.7.7.0/24
          gateway: 10.7.7.1

