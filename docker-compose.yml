# Opt-in AI track. Ignored by `docker compose up` unless `--profile ai` is set.
# mind-core is shared infrastructure, not a vulnerable lab.
# oracle-booth is the prompt-injection lab and is intentionally vulnerable.
# marionette is the excessive-agency lab and is intentionally vulnerable.
# It joins websploit and websploit-isolated. No other service joins the isolated network.
# tainted-well is the supply-chain, poisoning, and vector lab and is intentionally vulnerable.
# It stays on websploit only.
# echo-chamber is the LLM05 lab and is intentionally vulnerable.
# false-prophet is the misinformation lab and is intentionally vulnerable.
# It stays on websploit only.
# token-famine is the unbounded-consumption lab and is intentionally vulnerable.
# It stays on websploit only. The meter is hard-capped.
# Unused buffer: 10.6.6.46-.49. local-gguf is 10.6.6.57 and model-fetch is 10.6.6.58.
# Neither publishes a host port. Unused remainder: 10.6.6.59 and ports 5037-5039.
# Profile ai-model starts those two services only together with profile ai.
  mind-core:
    profiles: ["ai"]
    container_name: mind-core
    build: ./agentic-ai-labs/mind-core
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      # auto stays on the rules engine until local-gguf is healthy.
      # Override with MIND_CORE_BACKEND=deterministic to ignore the model.
      MIND_CORE_BACKEND: ${MIND_CORE_BACKEND:-auto}
      MIND_CORE_LOCAL_BASE_URL: http://local-gguf:8080
      MIND_CORE_BACKEND_TIMEOUT_SECONDS: ${MIND_CORE_BACKEND_TIMEOUT_SECONDS:-15}
      HOME: /tmp
    networks:
      websploit:
        ipv4_address: 10.6.6.50
    ports:
      - "5030:5030"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5030/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  oracle-booth:
    profiles: ["ai"]
    container_name: oracle-booth
    build: ./agentic-ai-labs/oracle-booth
    restart: unless-stopped
    depends_on:
      mind-core:
