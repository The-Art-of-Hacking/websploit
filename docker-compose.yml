  token-famine:
    profiles: ["ai"]
    container_name: token-famine
    build: ./agentic-ai-labs/token-famine
    restart: unless-stopped
    depends_on:
      mind-core:
        condition: service_healthy
    user: "10007:10007"
    read_only: true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    environment:
      HOME: /tmp
      MIND_CORE_URL: http://mind-core:5030
      TOKEN_FAMINE_MIND_CORE_TIMEOUT_SECONDS: "2"
      TOKEN_FAMINE_REQUEST_TIMEOUT_SECONDS: "2"
    networks:
      websploit:
        ipv4_address: 10.6.6.56
    ports:
      - "5036:5036"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5036/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional CPU GGUF tier. Profile ai-model depends on mind-core, so it is
  # valid only together with profile ai. Profile ai does not start these
  # services and does not download the weight. No host port: mind-core calls
  # local-gguf on the websploit bridge. Neither service joins websploit-isolated.
  model-fetch:
    profiles: ["ai-model"]
    container_name: model-fetch
    build:
      context: ./agentic-ai-labs/mind-core
      dockerfile: fetch.Dockerfile
    restart: "no"
    depends_on:
      mind-core:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    # Starts as root only to chown the volume, then setuid(10001) before the download.
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
      MIND_CORE_MODEL_DIR: /models
    volumes:
      - gguf-cache:/models
    networks:
      websploit:
        ipv4_address: 10.6.6.58

  local-gguf:
    profiles: ["ai-model"]
    container_name: local-gguf
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:c789283572ba78c2699b8945a96e654c850f938a717883f2e6187a14adac698f
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      mind-core:
        condition: service_healthy
      model-fetch:
        condition: service_completed_successfully
    mem_limit: 1536m
    cpus: 1.50
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    environment:
      HOME: /tmp
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --model
      - /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      - --ctx-size
      - "4096"
      - --threads
      - "2"
      - --n-gpu-layers
      - "0"
    volumes:
      - gguf-cache:/models:ro
    networks:
      websploit:
        ipv4_address: 10.6.6.57
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# Network configuration
networks:
  websploit:
    driver: bridge
    ipam:
      config:
        - subnet: 10.6.6.0/24
          gateway: 10.6.6.1
  # marionette is the only service attached. internal: true means a container
  # on this network alone has no route to the public internet.
  websploit-isolated:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.7.7.0/24
          gateway: 10.7.7.1

# The GGUF is not in git. model-fetch writes it here after the SHA-256 check.
volumes:
  gguf-cache:

