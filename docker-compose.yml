      MARIONETTE_MIND_CORE_TIMEOUT_SECONDS: "2"
      MARIONETTE_FETCH_TIMEOUT_SECONDS: "2"
    networks:
      websploit:
        ipv4_address: 10.6.6.52
      websploit-isolated:
        ipv4_address: 10.7.7.52
    ports:
      - "5032:5032"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5032/health', timeout=2).read()"]
